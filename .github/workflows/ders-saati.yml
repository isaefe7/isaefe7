name: ders-saati (flutter checks)

on:
  push:
    branches: [main]
    paths: ['projects/ders-saati/**']
  pull_request:
    paths: ['projects/ders-saati/**']

defaults:
  run:
    working-directory: projects/ders-saati

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub
        continue-on-error: true
