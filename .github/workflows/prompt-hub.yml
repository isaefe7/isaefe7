name: prompt-hub (check prompts)

on:
  push:
    branches: [main]
    paths: ['projects/prompt-hub/**']
  pull_request:
    paths: ['projects/prompt-hub/**']

defaults:
  run:
    working-directory: projects/prompt-hub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_prompts.py
      - run: pip install pytest
      - run: pytest -q
