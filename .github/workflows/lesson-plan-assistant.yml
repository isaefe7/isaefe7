name: lesson-plan-assistant (tests)

on:
  push:
    branches: [main]
    paths: ['projects/lesson-plan-assistant/**']
  pull_request:
    paths: ['projects/lesson-plan-assistant/**']

defaults:
  run:
    working-directory: projects/lesson-plan-assistant

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
